# Builds, signs and notarizes the Mac app on GitHub's hosted Macs.
# Add these repository secrets (Settings → Secrets and variables → Actions):
#   MAC_CERT_P12_BASE64   Developer ID Application certificate (.p12), base64-encoded
#   MAC_CERT_PASSWORD     password of that .p12
#   APPLE_ID              Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from appleid.apple.com
#   APPLE_TEAM_ID         10-character Team ID
# Without the secrets the run still succeeds and produces an unsigned app.
name: Desktop – macOS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; sed -i '' 's/notarize: true/notarize: false/' electron-builder.yml; fi
          bunx electron-builder --mac --config electron-builder.yml --publish never
      - name: Verify signature
        if: env.HAS_CERT == 'true'
        env: { HAS_CERT: "${{ secrets.MAC_CERT_P12_BASE64 != '' }}" }
        run: |
          APP=$(ls -d desktop-release/mac-arm64/Helm.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-mac
          path: |
            desktop-release/*.dmg
            desktop-release/*.zip


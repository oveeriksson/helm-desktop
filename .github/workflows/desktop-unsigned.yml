name: Desktop – unsigned preview installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Explicit unsigned configuration without an update feed
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('unsigned-config.json',JSON.stringify({extends:'./electron-builder.yml',publish:null,mac:{identity:null,notarize:false,forceCodeSigning:false},win:{forceCodeSigning:false,signAndEditExecutable:false}}))"
      - name: Build Mac DMG and ZIP
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac --config unsigned-config.json --publish never
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: bunx electron-builder --win --config unsigned-config.json --publish never
      - name: Verify automatic update feed is absent
        shell: bash
        run: |
          if find desktop-release -name app-update.yml -o -name latest.yml -o -name latest-mac.yml | grep -q .; then echo 'Unsigned builds must not contain an update feed'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop-release/*.dmg
            desktop-release/*.zip
            desktop-release/*.exe
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: unsigned-installers
          merge-multiple: true
      - name: Publish explicitly unsigned prerelease, never an update feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-unsigned"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Helm ${VERSION} — unsigned, signing pending" --notes "Unsigned preview installers built from the public Helm desktop repository. Apple signing/notarization and Windows Authenticode signing are pending. Operating-system security warnings or blocks may occur. These files are NOT distributed through automatic updates. Native installation and launch have not been verified on the user's devices. Includes version-specific update notes in the shell; application changes are documented in Helm's version history."
          fi
          gh release upload "$TAG" unsigned-installers/* --clobber